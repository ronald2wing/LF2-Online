# coturn TURN relay configuration for LF2 Online.
#
# Mounted into the coturn accessory (see config/deploy.yml) at
# /etc/coturn/turnserver.conf and run on the host network so coturn can bind
# the full relay port range without Docker's per-port overhead.
#
# The Rails app advertises this relay to clients via GET /protocol, built from
# three env vars (set in config/deploy.yml -> env):
#   TURN_URL        — where clients reach the relay (turn: or turns: URI, or a
#                     comma-separated list). Must point at this coturn (or a
#                     hosted TURN provider) for the relay to take effect.
#   TURN_USERNAME   — long-term credential username (see `user=` below).
#   TURN_CREDENTIAL — long-term credential password.
# A self-hoster MUST set TURN_URL to their own coturn (e.g. turn:203.0.113.10:3478)
# or a hosted provider; until then clients fall back to STUN only.
#
# THINGS TO CHANGE BEFORE EXPOSING THE RELAY:
#   - external-ip: your server's public IP (required behind NAT / a cloud LB).
#   - realm:       an arbitrary realm string; keep it consistent across deploys.
#   - user=:       the username:password pair clients authenticate with.

# Standard TURN listening ports (3478 = TURN, 5349 = TURN over TLS).
listening-port=3478
tls-listening-port=5349

# Relay port range used for the actual media streams.
min-port=49152
max-port=65535

# IPv4 only (run a second instance for IPv6 if needed).
no-ipv6

# Never allocate multicast or loopback addresses as relay candidates.
no-multicast-peers
no-loopback-peers

# Long-term credential auth. The username/password below must match the
# TURN_USERNAME / TURN_CREDENTIAL env vars the Rails app serves to clients.
lt-cred-mech
user=CHANGE_ME:CHANGE_ME

# An arbitrary realm; clients do not validate it, but it must be set.
realm=lf2.online

# Advertise a stable relay address. Replace with your server's public IP, or
# remove this line to auto-detect on a host with a public interface.
# external-ip=203.0.113.10

# Fingerprint to work around broken middleboxes that rewrite SDP.
fingerprint
