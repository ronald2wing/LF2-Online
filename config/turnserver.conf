# coturn TURN relay configuration for LF2 Online.
#
# Mounted into the coturn accessory (see config/deploy.yml) at
# /etc/coturn/turnserver.conf and run on the host network so coturn can bind
# the full relay port range without Docker's per-port overhead.
#
# The Rails app advertises this relay to clients via GET /protocol, built from
# three env vars (set in config/deploy.yml -> env):
#   TURN_URL        — where clients reach the relay (turn: or turns: URI, or a
#                     comma-separated list). Must point at this coturn (or a
#                     hosted TURN provider) for the relay to take effect.
#   TURN_USERNAME   — long-term credential username (supplied at runtime by the
#                     accessory, see config/deploy.yml).
#   TURN_CREDENTIAL — long-term credential password.
# A self-hoster MUST set TURN_URL to their own coturn (e.g. turn:203.0.113.10:3478)
# or a hosted provider; until then clients fall back to STUN only.
#
# THINGS TO CHANGE BEFORE EXPOSING THE RELAY:
#   - external-ip: your server's public IP (required behind NAT / a cloud LB).
#   - realm:       an arbitrary realm string; keep it consistent across deploys.
#   - The username:password credential is NOT in this file — it is supplied at
#     runtime by the coturn accessory (see config/deploy.yml) from .kamal/secrets.

# Standard TURN listening ports (3478 = TURN, 5349 = TURN over TLS).
listening-port=3478
tls-listening-port=5349

# Relay port range used for the actual media streams. Keep it narrow: every
# port here must be opened in the host firewall, so a 16k-port rule (up to
# 65535) is impractical; 96 ports is plenty for a small player base.
min-port=49152
max-port=49247

# IPv4 only (run a second instance for IPv6 if needed).
no-ipv6

# Never allocate multicast or loopback addresses as relay candidates.
no-multicast-peers
no-loopback-peers

# Long-term credential auth. The username/password are NOT committed here — a
# placeholder account is a backdoor once deployed. The real credential is
# supplied at runtime by the accessory (config/deploy.yml) and must match the
# TURN_USERNAME / TURN_CREDENTIAL the Rails app serves to clients.
lt-cred-mech

# An arbitrary realm; clients do not validate it, but it must be set.
realm=lf2.online

# Advertise a stable relay address. Set this whenever the host sits behind NAT
# (as here: config/deploy.yml points at a LAN address), otherwise coturn
# auto-detects the private address and hands out unreachable relay candidates.
# Omit it only when the public IP is already on the host's own interface.
#
# Use the public IP LITERAL, never a hostname: this value is what goes into the
# ICE relay candidate, which is always an IP (RFC 5766 14.5). coturn does accept
# a hostname, but it is undocumented, resolved once at startup, and then goes
# stale if the address moves — the maintainers advise against it.
# external-ip=203.0.113.10

# Fingerprint to work around broken middleboxes that rewrite SDP.
fingerprint
